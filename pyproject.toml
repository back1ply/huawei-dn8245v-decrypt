# Config only — this repo ships runnable scripts, not an installable package,
# so there is no [build-system] or [project] table. This file just centralizes
# tool configuration (ruff, pytest).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear
ignore = ["E501"]                         # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
